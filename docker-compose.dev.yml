services:
  app:
    build:
      context: .
      target: development
    container_name: cashier_app_dev
    restart: unless-stopped
    working_dir: /var/www
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=cashierngl
      - DB_USERNAME=root
      - DB_PASSWORD=rootsecret
    volumes:
      - .:/var/www
    networks:
      - cashier_dev_network
    depends_on:
      - db

  web:
    image: nginx:alpine
    container_name: cashier_web_dev
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - cashier_dev_network
    depends_on:
      - app

  db:
    image: mariadb:10.4
    container_name: cashier_db_dev
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=rootsecret
      - MYSQL_DATABASE=cashierngl
    ports:
      - "3308:3306"
    volumes:
      - cashier_dev_dbdata:/var/lib/mysql
    networks:
      - cashier_dev_network

networks:
  cashier_dev_network:
    driver: bridge

volumes:
  cashier_dev_dbdata:
    driver: local

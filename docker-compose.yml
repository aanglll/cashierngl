services:
  app:
    build:
      context: .
      target: development
    container_name: cashier_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - cashier_network
    depends_on:
      - db

  web:
    image: nginx:alpine
    container_name: cashier_web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - cashier_network
    depends_on:
      - app

  db:
    image: mariadb:10.4
    container_name: cashier_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootsecret
      MYSQL_DATABASE: cashierngl
    ports:
      - "3308:3306"
    volumes:
      - cashier_dbdata:/var/lib/mysql
    networks:
      - cashier_network

networks:
  cashier_network:
    driver: bridge

volumes:
  cashier_dbdata:
    driver: local
